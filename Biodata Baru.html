<!DOCTYPE html>
<head>

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #60DBC9 100%);

      padding: 20px;
      text-align: center;
    }

    h1 {
      color: white;
      font-weight: 600;

    }

    .profile h2 {

      font-weight: 600;
      margin-bottom: 15px;
    }

    }

      flex-wrap: wrap;
    }
    
    .nav-buttons button {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      border: 4px solid white;
      border-radius: 50px;
      background: #7D9E9B;
      color: white;
      text-decoration: none;
    }
    
    .page {
